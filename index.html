/* ---- Bahadur Bille: health bar ---- */
.health{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(440px,62vw);padding:8px 10px 9px;background:rgba(10,14,40,.78);border:3px solid #0b0b1e;box-shadow:0 0 0 2px #2f6bff,4px 4px 0 #0b0b1e;font:12px 'Press Start 2P','Courier New',monospace;color:#fff;z-index:11}
.health-label{display:flex;justify-content:space-between;margin-bottom:6px;letter-spacing:2px;text-shadow:2px 2px 0 #0b0b1e}
.health-label b{font-weight:normal;color:#ffd23a}
.health-cells{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:14px}
.health-cells i{background:#24203c;border:1px solid #0b0b1e}
.health.ok .health-cells i.on{background:linear-gradient(#8dff7a 0 45%,#2fcf4a 45%)}
.health.warn .health-cells i.on{background:linear-gradient(#ffe27a 0 45%,#f0a020 45%)}
.health.crit .health-cells i.on{background:linear-gradient(#ff8a7a 0 45%,#e0242a 45%)}
.health.crit{animation:hpPulse .5s steps(2) infinite}
.health.hit{box-shadow:0 0 0 2px #ff2a2a,4px 4px 0 #0b0b1e;transform:translateX(-50%) translateY(2px)}
.health.dead .health-label span{color:#ff4a3a}
@keyframes hpPulse{50%{box-shadow:0 0 0 2px #ff2a2a,4px 4px 0 #0b0b1e}}
@media (max-width:700px){.health{top:auto;bottom:118px;width:72vw;font-size:9px}}
/* ---- Bahadur Bille: home screen ---- */
#home{position:fixed;inset:0;z-index:28;overflow:hidden;background:#0a1a6e;color:#fff;font-family:'Press Start 2P','Courier New',monospace;image-rendering:pixelated}
#home[hidden]{display:none}
.home-art{position:absolute;inset:0;background-size:cover;background-position:62% 40%;image-rendering:pixelated;animation:homeDrift 18s ease-in-out infinite alternate}
@keyframes homeDrift{from{transform:scale(1.04) translateX(0)}to{transform:scale(1.08) translateX(-1.5%)}}
.home-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,48,.94) 0,rgba(4,10,48,.78) 30%,rgba(4,10,48,0) 58%),linear-gradient(0deg,rgba(4,10,48,.7),transparent 35%)}
.home-menu{position:absolute;left:clamp(18px,5vw,80px);top:50%;transform:translateY(-50%);width:min(440px,88vw);display:flex;flex-direction:column}
.home-eyebrow{margin:0 0 18px;font-size:10px;letter-spacing:3px;color:#7fb2ff}
.home-title{margin:0;display:flex;flex-direction:column;line-height:1.05;font-size:clamp(34px,5.4vw,70px);letter-spacing:2px;font-weight:normal}
.home-title span{color:#ffd23a;text-shadow:0 4px 0 #e0242a,0 8px 0 #0b0b1e,5px 5px 0 #0b0b1e}
.home-title span+span{color:#fff;text-shadow:0 4px 0 #2f6bff,0 8px 0 #0b0b1e,5px 5px 0 #0b0b1e}
.home-tag{margin:26px 0 26px;font:20px 'VT323','Courier New',monospace;letter-spacing:1px;color:#dfe8ff}
.home-menu nav{display:flex;flex-direction:column;gap:12px}
.home-btn{position:relative;text-align:left;padding:15px 18px;font:12px 'Press Start 2P','Courier New',monospace;letter-spacing:2px;color:#fff;background:#173ea8;border:3px solid #0b0b1e;box-shadow:inset 0 -5px 0 #0f2a78,4px 4px 0 #0b0b1e;cursor:pointer;transition:transform .08s}
.home-btn:hover:not(:disabled),.home-btn:focus-visible{background:#2f6bff;transform:translateX(6px);outline:none}
.home-btn:hover:not(:disabled)::before,.home-btn:focus-visible::before{content:'▶';position:absolute;left:-24px;color:#ffd23a}
.home-btn:active:not(:disabled){transform:translate(6px,3px);box-shadow:inset 0 -2px 0 #0f2a78,1px 1px 0 #0b0b1e}
.home-btn.primary{background:#e0242a;box-shadow:inset 0 -5px 0 #8c1218,4px 4px 0 #0b0b1e;font-size:15px;padding:18px}
.home-btn.primary:hover:not(:disabled){background:#ff3a3a}
.home-btn.small{font-size:10px;padding:11px 18px;align-self:flex-start}
.home-btn:disabled{opacity:.6;cursor:wait}
.home-how{margin-top:16px;padding:12px 14px;background:rgba(10,14,40,.85);border:2px solid #2f6bff;font:18px/1.35 'VT323','Courier New',monospace;color:#dfe8ff}
.home-how b{color:#ffd23a;font-weight:normal}
.home-credits{margin:20px 0 0;font-size:11px;color:#ffd23a;letter-spacing:2px}
.home-link{margin-left:16px;background:transparent;border:1px solid #d4ba82;color:#e5c98f;font:11px monospace;letter-spacing:2px;padding:6px 10px}
@media (max-width:700px){.home-shade{background:linear-gradient(0deg,rgba(4,10,48,.95) 0,rgba(4,10,48,.8) 50%,rgba(4,10,48,.1) 80%)}.home-menu{top:auto;bottom:24px;transform:none}.home-title{font-size:32px}.home-tag{margin:14px 0}.home-art{background-position:40% 20%}}

#mission{position:fixed;inset:0;z-index:27;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,26,110,.72),rgba(4,10,48,.94));font-family:'Press Start 2P','Courier New',monospace;color:#fff;animation:mFade .5s ease-out}
#mission[hidden]{display:none}

@keyframes mPop{from{transform:scale(.6) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

.mp-rooms{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.mp-room{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:#102434;border:2px solid #22394a;color:#fff;cursor:pointer;font:9px 'Press Start 2P',monospace;text-align:left}.mp-room:hover{border-color:#1fd18e}.mp-room span{color:#8fb6c8;font-size:8px}
.mp-link{background:none;border:0;color:#5dffb6;font:8px 'Press Start 2P',monospace;cursor:pointer;text-decoration:underline}
.mp-code{margin-left:12px;padding:4px 8px;font-size:12px;color:#0b0b1e;background:#ffd23a;letter-spacing:3px}
.mp-players{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}.mp-pl{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#102434;border:2px solid #22394a;font-size:9px}.mp-pl.me{border-color:#ffd23a}.mp-pl em{margin-left:auto;font-style:normal;color:#ffd23a;font-size:7px}
.mp-board{position:fixed;right:12px;top:170px;z-index:11;min-width:170px;padding:6px 8px;background:rgba(4,20,30,.7);border:2px solid #1fd18e;font:8px 'Press Start 2P',monospace;color:#cfe}
.mp-board div{display:flex;gap:6px;padding:3px 0}.mp-board div.me{color:#ffd23a}.mp-board b{width:12px}.mp-board span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mp-board em{font-style:normal}
.mp-final{display:flex;flex-direction:column;gap:6px;margin:10px 0}.mp-final div{display:flex;align-items:center;gap:10px;padding:8px;background:#102434;border:2px solid #22394a;font-size:10px}.mp-final div.me{border-color:#ffd23a}.mp-final em{margin-left:auto;font:16px 'VT323',monospace;font-style:normal;color:#bcd8e6}
body.cockpit-view .mp-board{top:60px}
@media (max-width:760px),(max-height:500px){.mp-grid{grid-template-columns:1fr;gap:6px}.mp-card{padding:10px 12px}.mp-card h2{font-size:12px}.mp-jets{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}.mp-jet-art{width:48px;height:30px}.mp-board{top:auto;bottom:10px;right:auto;left:50%;transform:translateX(-50%);min-width:0;font-size:6px}}
/* voice chat */
#vcBar{position:fixed;left:12px;bottom:12px;z-index:60;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:min(560px,70vw);padding:8px;background:rgba(8,14,22,.82);border:1px solid #2fd39a;font:11px/1.2 "Courier New",monospace;color:#cfe;pointer-events:auto}
#vcBar[hidden]{display:none}
#vcBar.inmatch{top:auto;bottom:auto;top:54px;left:10px;background:rgba(8,14,22,.6);max-width:46vw}
#vcBar button{font:inherit;cursor:pointer;border:1px solid #2fd39a;background:#0f2230;color:#cfe;padding:6px 9px;letter-spacing:.06em}
#vcBar .vc-main,#vcBar .vc-talk{background:#1b3cb0;border-color:#5f8bff;font-weight:bold}
#vcBar .vc-talk.on{background:#d8262f;border-color:#ff8a8a}
#vcBar .vc-talk{touch-action:none;user-select:none;-webkit-user-select:none}
#vcBar .vc-mini{padding:4px 7px;opacity:.85}
#vcBar .vc-list{display:flex;flex-wrap:wrap;gap:4px;width:100%}
#vcBar .vc-p{padding:3px 6px;border-color:#33465a}
#vcBar .vc-p.live{border-color:#2fd39a}
#vcBar .vc-p.linking{border-color:#e8b33c}
#vcBar .vc-p.off{opacity:.5}
#vcBar .vc-p.talk{background:#2fd39a;color:#061016}
#vcBar .vc-p.muted{text-decoration:line-through;opacity:.6}
#vcBar .vc-err{color:#ff7a7a;width:100%}
#vcBar .vc-note{opacity:.6}
@media (max-width:820px){#vcBar.inmatch{top:auto;bottom:96px;left:8px;max-width:52vw}#vcBar.inmatch .vc-list,#vcBar.inmatch .vc-mini{display:none}#vcBar .vc-talk{padding:12px 14px}}
#vcMic{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:70;font:bold 11px "Courier New",monospace;letter-spacing:.05em;padding:6px 9px;border:1px solid #5a6b7c;background:rgba(8,14,22,.7);color:#9ab;cursor:pointer}
#vcMic.on{border-color:#2fd39a;color:#2fd39a}
#vcMic[hidden],#vcAsk[hidden]{display:none}
#vcAsk{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;width:min(420px,88vw);padding:18px 20px;background:rgba(8,14,22,.94);border:2px solid #2fd39a;color:#cfe;font:13px/1.4 "Courier New",monospace;text-align:center}
#vcAsk h2{margin:.2em 0 .4em;font-size:18px;color:#2fd39a}
#vcAsk nav{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* phone typing editor: fills only the space above the keyboard */
#mtEdit{position:fixed;left:0;right:0;top:0;height:100vh;z-index:120;display:flex;align-items:center;justify-content:center;background:rgba(4,8,14,.86);padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));box-sizing:border-box}
#mtEdit[hidden]{display:none}
#mtEdit .mt-box{width:min(640px,100%);font:13px "Courier New",monospace;color:#cfe}
#mtEdit .mt-label{display:block;color:#ffcf4a;letter-spacing:.12em;text-transform:uppercase;font-size:12px;margin-bottom:6px}
#mtEdit .mt-row{display:flex;gap:8px}
#mtEdit .mt-in{flex:1;min-width:0;font:18px "Courier New",monospace;padding:12px;background:#0f2230;color:#fff;border:2px solid #2fd39a;border-radius:0;outline:none}
#mtEdit .mt-done{flex:none;min-width:96px;font:bold 15px "Courier New",monospace;letter-spacing:.08em;background:#e2262f;color:#fff;border:0;box-shadow:0 4px 0 #8e1219;padding:0 16px}
#mtEdit .mt-cancel{margin-top:8px;background:none;border:0;color:#8fb;text-decoration:underline;font:12px "Courier New",monospace;padding:6px 2px}
#mtEdit.tight .mt-label{margin-bottom:3px;font-size:11px}
#mtEdit.tight .mt-in{padding:8px 10px;font-size:17px}
#mtEdit.tight .mt-cancel{display:none}
/* phones: multiplayer screen split in two, built-in keyboard on the right (bottom in portrait) */
body.mpkb #mpPanel{right:50%;padding:6px;align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
body.mpkb #mpPanel>div{width:100%;max-width:none;max-height:none;margin:0;padding:10px;box-sizing:border-box}
body.mpkb #mpPanel .mp-grid,body.mpkb #mpPanel .mp-cols{display:block!important}
body.mpkb #mpPanel input.mp-in{caret-color:transparent;cursor:pointer}
body.mpkb #mpPanel input.mp-in.kb-on{border-color:#ffcf4a!important;box-shadow:0 0 0 2px #ffcf4a}
#mpKb{position:fixed;top:0;right:0;bottom:0;width:50%;z-index:33;display:flex;flex-direction:column;gap:6px;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) 6px;box-sizing:border-box;background:#070c14;border-left:2px solid #2fd39a;font-family:"Courier New",monospace;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#mpKb[hidden]{display:none}
#mpKb .kb-top{flex:none}
#mpKb .kb-label{display:block;color:#ffcf4a;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#mpKb .kb-show{margin-top:3px;min-height:30px;padding:5px 8px;border:2px solid #2fd39a;background:#0f2230;color:#fff;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
#mpKb .kb-show i{color:#577;font-style:normal}
#mpKb .kb-show.empty{border-color:#33465a;color:#577}
#mpKb .kb-caret{display:inline-block;width:2px;height:1em;background:#ffcf4a;vertical-align:-2px;margin-left:1px;animation:kbBlink 1s steps(1) infinite}
#mpKb .kb-show.empty .kb-caret{display:none}
@keyframes kbBlink{50%{opacity:0}}
#mpKb .kb-keys{flex:1;display:flex;flex-direction:column;gap:4px;min-height:0}
#mpKb .kb-row{flex:1;display:flex;gap:4px;min-height:0}
#mpKb .kb-k{flex:1;min-width:0;padding:0;border:1px solid #2b3d52;border-radius:5px;background:#16263a;color:#e8f4ff;font:bold 16px "Courier New",monospace;cursor:pointer}
#mpKb .kb-k.down{background:#2fd39a;color:#04110c}
#mpKb .kb-k.fn{background:#0d1a28;color:#9fc}
#mpKb .kb-k.fn.on{background:#ffcf4a;color:#111}
#mpKb .kb-k.space{flex:3.2}
#mpKb .kb-k.go{flex:2;background:#e2262f;border-color:#ff7a7a;color:#fff;font-size:13px}
#mpKb .kb-keys.num .kb-k{font-size:24px}
#mpKb .kb-keys.num .kb-k.go{font-size:24px}
@media (orientation:portrait){body.mpkb #mpPanel{right:0;bottom:46%}#mpKb{top:auto;width:100%;height:46%;border-left:0;border-top:2px solid #2fd39a}}
/* phones (split screen): voice strip sits under the menu half, never over its buttons */
body.mpkb #vcBar{left:0;right:50%;bottom:0;max-width:none;flex-wrap:nowrap;overflow-x:auto;padding:5px 6px;border-width:1px 0 0;box-sizing:border-box}
body.mpkb #vcBar .vc-list{flex-wrap:nowrap;width:auto}
body.mpkb #vcBar .vc-err{width:auto;white-space:nowrap}
body.mpkb:has(#vcBar:not([hidden])) #mpPanel{bottom:44px}
@media (orientation:portrait){body.mpkb #vcBar{right:0;bottom:46%}body.mpkb:has(#vcBar:not([hidden])) #mpPanel{bottom:calc(46% + 44px)}}
/* voice strip never covers multiplayer buttons */
body:has(#vcBar:not([hidden])) #mpPanel{padding-bottom:64px}
body.mobile #vcBar:not(.inmatch){left:0;right:0;bottom:0;max-width:none;flex-wrap:nowrap;overflow-x:auto;padding:5px 6px;border-width:1px 0 0;box-sizing:border-box}
body.mobile #vcBar .vc-list{flex-wrap:nowrap;width:auto}
body.mobile:has(#vcBar:not([hidden])) #mpPanel{padding-bottom:0;bottom:44px}
body.mpkb #vcBar{right:50%!important}
@media (orientation:portrait){body.mpkb #vcBar{right:0!important}}

/* Voice chat for multiplayer rooms.
   Audio goes straight between players (WebRTC mesh); the Cloudflare hub only passes the setup messages.
   Push-to-talk by default: hold T (or the TALK button on phones). Open mic can be switched on. */
const vc={on:false,stream:null,peers:new Map(),open:false,talking:false,keyDown:false,btnDown:false,muted:new Set(),speaking:new Set()};
const VC_BOOST=2.6;let vcAC=null;
/* Phones only allow an AudioContext to start inside a tap. Until it is running, voices play
   through a normal <audio> element (no boost) so they are never silent. */
function vcUnlock(){try{if(!vcAC)vcAC=new(window.AudioContext||window.webkitAudioContext)();if(vcAC.state!=='running')vcAC.resume().then(vcRouteAll,()=>{});else vcRouteAll()}catch{}
  for(const p of vc.peers.values())if(p.audio)p.audio.play().catch(()=>{})}
function vcRoute(id){const p=vc.peers.get(id);if(!p||!p.stream||!p.audio)return;const mute=vc.muted.has(id);
  if(vcAC&&vcAC.state==='running'){try{if(!p.src||p.srcStream!==p.stream){if(p.src)p.src.disconnect();p.src=vcAC.createMediaStreamSource(p.stream);p.srcStream=p.stream;p.gain=p.gain||vcAC.createGain();p.src.connect(p.gain);p.gain.connect(vcAC.destination)}
    p.gain.gain.value=mute?0:VC_BOOST;p.audio.muted=true;p.audio.volume=0;p.audio.play().catch(()=>{});return}catch{}}
  p.audio.muted=mute;p.audio.volume=1;p.audio.play().catch(()=>{})}
function vcRouteAll(){for(const id of vc.peers.keys())vcRoute(id)}
for(const ev of ['pointerdown','touchend','keydown'])addEventListener(ev,()=>{if(vc.on&&(!vcAC||vcAC.state!=='running'))vcUnlock()},{capture:true,passive:true});
const VC_ICE=[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'}];
try{vc.open=localStorage.getItem('bb-vc-open')==='1'}catch{}

const vcBar=document.createElement('div');vcBar.id='vcBar';vcBar.hidden=true;document.body.appendChild(vcBar);
for(const ev of ['mousedown','touchstart','touchmove','touchend','pointerdown'])vcBar.addEventListener(ev,e=>e.stopPropagation());

function vcOthers(){return mp.room?(mp.room.players||[]).filter(p=>p.id!==mp.you):[]}
function vcNick(id){const p=mp.room&&(mp.room.players||[]).find(p=>p.id===id);return p?p.nick:'Pilot'}

async function vcStart(){
  if(vc.on||!mp.room)return;vcUnlock();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){vc.err='This browser cannot use a microphone here.';vcRender();return}
  try{vc.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}
  catch(e){vc.err=e&&e.name==='NotAllowedError'?'Microphone blocked. Allow it in the browser address bar, then try again.':'No microphone found.';vcRender();return}
  vc.err='';vc.on=true;vcApplyTalk();mpSend({t:'vs',on:true});vcSync();vcRender();
}
function vcStop(){
  if(vc.on)mpSend({t:'vs',on:false});
  for(const id of [...vc.peers.keys()])vcDrop(id);
  if(vc.stream)vc.stream.getTracks().forEach(t=>t.stop());
  vc.stream=null;vc.on=false;vc.talking=false;vc.speaking.clear();vcRender();
}
function vcDrop(id){const p=vc.peers.get(id);if(!p)return;try{p.src&&p.src.disconnect();p.gain&&p.gain.disconnect()}catch{}try{p.pc.close()}catch{}if(p.audio){p.audio.srcObject=null;p.audio.remove()}vc.peers.delete(id);vc.speaking.delete(id)}

function vcPeer(id){
  let p=vc.peers.get(id);if(p)return p;
  const pc=new RTCPeerConnection({iceServers:VC_ICE});
  p={pc,audio:null,pending:[],born:performance.now()};vc.peers.set(id,p);
  if(vc.stream)for(const t of vc.stream.getAudioTracks())pc.addTrack(t,vc.stream);
  pc.onicecandidate=e=>{if(e.candidate)mpSend({t:'v',to:id,ice:e.candidate})};
  pc.ontrack=e=>{if(!p.audio){p.audio=document.createElement('audio');p.audio.autoplay=true;p.audio.playsInline=true;p.audio.setAttribute('playsinline','');document.body.appendChild(p.audio)}
    p.stream=e.streams[0]||new MediaStream([e.track]);p.audio.srcObject=p.stream;vcRoute(id)};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'){vcDrop(id);setTimeout(vcSync,1500)}vcRender()};
  return p;
}
async function vcOffer(id){const p=vcPeer(id);try{await p.pc.setLocalDescription(await p.pc.createOffer());mpSend({t:'v',to:id,sdp:p.pc.localDescription})}catch{}}

// Keep one connection to every other pilot who has voice on. The lower id makes the offer.
function vcSync(){
  if(!vc.on||!mp.room){if(vc.peers.size)for(const id of [...vc.peers.keys()])vcDrop(id);return}
  const want=new Set(vcOthers().filter(p=>p.voice).map(p=>p.id));
  for(const id of [...vc.peers.keys()])if(!want.has(id))vcDrop(id);
  for(const id of want)if(!vc.peers.has(id)&&mp.you<id)vcOffer(id);
}
async function vcSignal(m){
  if(!vc.on)return;const id=m.from;
  if(m.sdp){if(m.sdp.type==='offer'){const old=vc.peers.get(id);if(old&&old.pc.signalingState!=='stable')vcDrop(id)}const p=vcPeer(id);
    try{await p.pc.setRemoteDescription(m.sdp);
      for(const c of p.pending.splice(0))await p.pc.addIceCandidate(c).catch(()=>{});
      if(m.sdp.type==='offer'){await p.pc.setLocalDescription(await p.pc.createAnswer());mpSend({t:'v',to:id,sdp:p.pc.localDescription})}}catch{}}
  else if(m.ice){const p=vc.peers.get(id)||vcPeer(id);
    if(p.pc.remoteDescription)p.pc.addIceCandidate(m.ice).catch(()=>{});else p.pending.push(m.ice)}
}

function vcApplyTalk(){
  const on=vc.on&&(vc.open||vc.keyDown||vc.btnDown);
  if(vc.stream)vc.stream.getAudioTracks().forEach(t=>t.enabled=on);
  if(on!==vc.talking){vc.talking=on;mpSend({t:'vt',on});vcRender()}
}

// Hook into the multiplayer client without touching its internals.
{const base=mpOn;mpOn=function(m){
  if(m.t==='v'){vcSignal(m);return}
  if(m.t==='vt'){if(m.on)vc.speaking.add(m.id);else vc.speaking.delete(m.id);vcRender();return}
  base(m);
  if(['joined','room','left','end','start'].includes(m.t)){vcSync();vcRender()}
}}
{const base=mpSend;mpSend=function(m){if(m&&m.t==='leave'&&vc.on){vc.on=false;for(const id of [...vc.peers.keys()])vcDrop(id);if(vc.stream)vc.stream.getTracks().forEach(t=>t.stop());vc.stream=null;vc.talking=false}base(m);if(m&&m.t==='leave')setTimeout(vcRender,50)}}
setInterval(()=>{if(!mp.room&&vc.on){vcStop();return}
  if(vc.on){const now=performance.now();for(const [id,p] of [...vc.peers]){const st=p.pc.connectionState;
    if(st!=='connected'&&now-p.born>8000){vcDrop(id);if(mp.you<id)vcOffer(id)}}vcSync()}
  vcRender()},1500);

addEventListener('keydown',e=>{if(e.code!=='KeyT'||!vc.on||e.target.closest('input,textarea,select'))return;e.preventDefault();if(!vc.keyDown){vc.keyDown=true;vcApplyTalk()}},true);

/* Phone typing: tapping a text box in the multiplayer screens opens a compact editor
   that fits in the space left above the on-screen keyboard (top half in landscape). */
const mtIsPhone=()=>(document.body.classList.contains('mobile')||matchMedia('(pointer:coarse)').matches)&&!document.body.classList.contains('mpkb');
const MT_FIELDS={nick:{label:'Call sign',go:null},rname:{label:'Room name',go:null},code:{label:'Room code (3 digits)',go:'joincode',digits:true},url:{label:'Server address',go:'saveurl'}};
const mt=document.createElement('div');mt.id='mtEdit';mt.hidden=true;
mt.innerHTML='<div class="mt-box"><label class="mt-label"></label><div class="mt-row"><input class="mt-in" autocomplete="off" autocorrect="off" spellcheck="false"><button class="mt-done" type="button">DONE</button></div><button class="mt-cancel" type="button">cancel</button></div>';
document.body.appendChild(mt);
const mtIn=mt.querySelector('.mt-in'),mtDone=mt.querySelector('.mt-done');let mtField=null,mtOrig='';
for(const ev of ['mousedown','touchstart','touchmove','touchend','pointerdown','keydown','keyup','wheel'])mt.addEventListener(ev,e=>e.stopPropagation());

function mtTarget(){return mtField&&mpPanel.querySelector(`[data-f=${mtField}]`)}
function mtWrite(){const el=mtTarget();if(el){el.value=mtIn.value;el.dispatchEvent(new Event('input',{bubbles:true}))}}
function mtOpen(el){
  const f=el.dataset.f,cfg=MT_FIELDS[f]||{label:el.placeholder||'Type'};mtField=f;mtOrig=el.value;
  mt.querySelector('.mt-label').textContent=cfg.label;
  mtIn.value=el.value;mtIn.placeholder=el.placeholder||'';mtIn.maxLength=el.maxLength>0?el.maxLength:200;
  mtIn.setAttribute('autocapitalize',f==='url'?'none':'words');
  mtIn.setAttribute('inputmode',cfg.digits?'numeric':f==='url'?'url':'text');
  mtIn.setAttribute('enterkeyhint',cfg.go?'go':'done');
  mtDone.textContent=cfg.go==='joincode'?'JOIN':cfg.go==='saveurl'?'CONNECT':'DONE';
  mt.hidden=false;mtFit();mtIn.focus();
  try{mtIn.setSelectionRange(mtIn.value.length,mtIn.value.length)}catch{}
}
function mtClose(commit){
  if(mt.hidden)return;
  if(commit)mtWrite();else{const el=mtTarget();if(el)el.value=mtOrig}
  const f0=mtField,go=commit&&(MT_FIELDS[mtField]||{}).go&&mtIn.value.trim();
  mt.hidden=true;mtIn.blur();mtField=null;
  if(go){const b=mpPanel.querySelector('[data-a='+(MT_FIELDS[f0]||{}).go+']');if(b)b.click()}
}
mtIn.addEventListener('input',()=>{if(MT_FIELDS[mtField]&&MT_FIELDS[mtField].digits)mtIn.value=mtIn.value.replace(/\D/g,'').slice(0,3);mtWrite()});
mtIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();mtClose(true)}else if(e.key==='Escape'){e.preventDefault();mtClose(false)}});

mtDone.addEventListener('click',()=>mtClose(true));
mt.querySelector('.mt-cancel').addEventListener('click',()=>mtClose(false));
mt.addEventListener('click',e=>{if(e.target===mt)mtClose(true)});

  mt.style.top=top+'px';mt.style.height=h+'px';mt.classList.toggle('tight',h<240)}

/* Multiplayer screens on phones: the phone's own keyboard never opens.
   The screen splits in two (landscape: left = menus, right = keyboard; portrait: top / bottom)
   and the player types with this built-in keyboard. Also: music off while in multiplayer. */
const kbPhone=()=>document.body.classList.contains('mobile')||matchMedia('(pointer:coarse)').matches;
const KB_INFO={nick:{label:'Call sign'},rname:{label:'Room name'},code:{label:'Room code',go:'joincode',digits:true,max:3},url:{label:'Server address',go:'saveurl',lower:true}};
const kb={active:null,shift:false,vals:{}};
const kbEl=document.createElement('div');kbEl.id='mpKb';kbEl.hidden=true;document.body.appendChild(kbEl);
for(const ev of ['mousedown','touchstart','touchmove','touchend','pointerdown','wheel'])kbEl.addEventListener(ev,e=>e.stopPropagation());

const KB_ROWS=[['1','2','3','4','5','6','7','8','9','0'],['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l','⌫'],['⇧','z','x','c','v','b','n','m','.','-']];
function kbField(){return kb.active&&mpPanel.querySelector(`[data-f=${kb.active}]`)}
function kbRender(){
  const f=kbField(),info=KB_INFO[kb.active]||{},v=f?f.value:'';
  const digitsOnly=!!info.digits;
  const rows=(digitsOnly?[['1','2','3'],['4','5','6'],['7','8','9'],['⌫','0','✓']]:KB_ROWS).map(r=>'<div class="kb-row">'+r.map(k=>{
    const label=k.length===1&&kb.shift?k.toUpperCase():k;
    const cls=k==='⌫'?'kb-k fn':k==='⇧'?'kb-k fn'+(kb.shift?' on':''):k==='✓'?'kb-k go':'kb-k';
    return `<button class="${cls}" data-k="${k}">${k==='✓'?(info.go==='joincode'?'JOIN':'✓'):label}</button>`}).join('')+'</div>').join('');
  const goLabel=info.go==='joincode'?'JOIN':info.go==='saveurl'?'CONNECT':'DONE';
  kbEl.innerHTML=`<div class="kb-top"><span class="kb-label">${f?info.label:'Tap a box on the left to type'}</span><div class="kb-show ${f?'':'empty'}">${f?esc(v)||'<i>'+esc(f.placeholder||'')+'</i>':'—'}<b class="kb-caret"></b></div></div>
   <div class="kb-keys ${digitsOnly?'num':''}">${rows}${digitsOnly?'':`<div class="kb-row"><button class="kb-k fn" data-k="/">/</button><button class="kb-k fn" data-k=":">:</button><button class="kb-k space" data-k=" ">space</button><button class="kb-k fn" data-k="'">'</button><button class="kb-k go" data-k="✓">${goLabel}</button></div>`}</div>`;
  for(const el of mpPanel.querySelectorAll('input.mp-in'))el.classList.toggle('kb-on',el.dataset.f===kb.active);
}
function kbSet(f){kb.active=f;kb.shift=false;kbRender()}
function kbPress(k){
  const f=kbField();if(!f){return}
  const info=KB_INFO[kb.active]||{},max=info.max||(f.maxLength>0?f.maxLength:200);let v=f.value;
  if(navigator.vibrate)navigator.vibrate(6);
  if(k==='⌫')v=v.slice(0,-1);
  else if(k==='⇧'){kb.shift=!kb.shift;kbRender();return}
  else if(k==='✓'){const go=info.go;kb.active=null;kbRender();if(go){const b=mpPanel.querySelector(`[data-a=${go}]`);if(b)b.click()}return}
  else{let c=kb.shift?k.toUpperCase():k;if(info.digits&&!/\d/.test(c))return;if(info.lower)c=c.toLowerCase();if(v.length>=max)return;v+=c;if(kb.shift){kb.shift=false}}
  f.value=v;kb.vals[kb.active]=v;f.dispatchEvent(new Event('input',{bubbles:true}));kbRender();
}
kbEl.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();b.classList.add('down');kbPress(b.dataset.k)});
for(const ev of ['pointerup','pointercancel','pointerleave'])kbEl.addEventListener(ev,e=>{const b=e.target.closest&&e.target.closest('[data-k]');if(b)b.classList.remove('down')});
// Hardware keys still work (e.g. a phone with a keyboard attached).
addEventListener('keydown',e=>{if(!document.body.classList.contains('mpkb')||!kb.active||mpPanel.hidden)return;
  if(e.key==='Backspace')kbPress('⌫');else if(e.key==='Enter')kbPress('✓');else if(e.key.length===1)kbPress(e.key);else return;e.preventDefault();e.stopPropagation()},true);

// Inputs on phones: read-only so the system keyboard never appears; tapping picks the box.
function kbPrep(){
  const on=kbPhone()&&!mpPanel.hidden&&!!mpPanel.querySelector('input.mp-in');
  document.body.classList.toggle('mpkb',on);kbEl.hidden=!on;
  if(!on)return;
  for(const el of mpPanel.querySelectorAll('input.mp-in')){el.readOnly=true;el.setAttribute('inputmode','none');
    if(kb.vals[el.dataset.f]!==undefined)el.value=kb.vals[el.dataset.f]}
  const fields=[...mpPanel.querySelectorAll('input.mp-in')].map(e=>e.dataset.f);
  if(kb.active&&!fields.includes(kb.active))kb.active=null;
  kbRender();
}
mpPanel.addEventListener('pointerdown',e=>{if(!document.body.classList.contains('mpkb'))return;const el=e.target.closest('input.mp-in');if(!el)return;e.preventDefault();kbSet(el.dataset.f)},true);
mpPanel.addEventListener('focusin',e=>{if(document.body.classList.contains('mpkb')&&e.target.matches('input.mp-in'))e.target.blur()});
{const base=mpRender;mpRender=function(...a){const r=base.apply(this,a);kbPrep();return r}}
new MutationObserver(()=>{kbPrep();syncMusic()}).observe(mpPanel,{attributes:true,attributeFilter:['hidden']});
new MutationObserver(()=>syncMusic()).observe(mpResults,{attributes:true,attributeFilter:['hidden']});
addEventListener('resize',kbPrep);

/* Music: off as soon as the player opens multiplayer; game sounds on. Back on when they leave. */
const kbInMp=()=>!mpPanel.hidden||!mpResults.hidden||!!mp.room||combat.mpMode;
{const base=syncMusic;syncMusic=function(){if(kbInMp()){bgm.pause();return}base()}}
{const base=mpOpen;mpOpen=function(...a){bgm.pause();try{vcSound(true)}catch{}return base.apply(this,a)}}

/* Mobile: landscape / full-screen choice on first load, rotate hint, and a touch-first HUD layout. */
const IS_MOBILE=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if(IS_MOBILE){
 document.body.classList.add('mobile');
 const rotate=document.createElement('div');rotate.id='rotateHint';rotate.innerHTML='<div class="phone-icon"></div><b>ROTATE YOUR PHONE</b><span>Bahadur Bille plays in landscape</span>';document.body.append(rotate);
 const fsSupported=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
 const goFull=async()=>{const el=document.documentElement;try{if(el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}};
 const gate=document.createElement('section');gate.id='mobileGate';
 gate.innerHTML=`<div class="gate-card"><div class="gate-icon">📱</div><p class="home-eyebrow">MOBILE DEVICE DETECTED</p><h2>You are playing on a mobile device</h2><p class="gate-text">Pick how you want to fly:</p>
  <button class="home-btn primary" data-g="full"><span class="gate-glyph">⛶</span> FULL SCREEN LANDSCAPE<small>${fsSupported?'Recommended · fills the screen, sideways, no browser bars':'Full screen is not supported here: use Share → Add to Home Screen. Plays sideways in the browser.'}</small></button>
  <button class="home-btn" data-g="land"><span class="gate-glyph">⟲</span> LANDSCAPE<small>Sideways, browser bars stay visible</small></button></div>`;
 for(const ev of ['touchstart','touchmove','touchend','mousedown','mouseup'])gate.addEventListener(ev,e=>e.stopPropagation());
 document.body.append(gate);
 const lockLandscape=async()=>{document.body.classList.add('want-landscape');try{await screen.orientation.lock('landscape')}catch(e){/* iOS etc.: the rotate hint asks the player instead */}};
 gate.querySelector('[data-g=full]').onclick=async()=>{await goFull();await lockLandscape();gate.remove()};
 gate.querySelector('[data-g=land]').onclick=async()=>{await lockLandscape();gate.remove()};
 // keep the canvas sized after rotation / fullscreen changes
 const nudge=()=>setTimeout(()=>dispatchEvent(new Event('resize')),250);addEventListener('orientationchange',nudge);document.addEventListener('fullscreenchange',nudge);
}
</script></body></html>
